<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>FocusBoard</title>
<style>
/* =========================================================================
   FocusBoard — single-file personal Kanban board
   CSS is organized in labeled sections.
   ========================================================================= */

/* ---------- 1. Reset & base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
    Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  min-height: 100dvh;
  overflow-x: hidden; /* prevent accidental page-level horizontal overflow */
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select, button { font-family: inherit; }
[hidden] { display: none !important; } /* ensure hidden attr wins over display rules */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- 2. Theme tokens ---------- */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --surface-3: #e6e9ef;
  --border: #dfe3ea;
  --border-strong: #c9cfdb;
  --text: #1e2330;
  --text-muted: #64707f;
  --text-faint: #8b95a5;
  --accent: #5b5bd6;
  --accent-hover: #4a4ac0;
  --accent-soft: #ececfb;
  --accent-contrast: #ffffff;
  --danger: #dc2f45;
  --danger-soft: #fdecee;
  --warn: #d9820a;
  --warn-soft: #fdf1df;
  --success: #14915b;
  --success-soft: #e5f5ec;
  --info: #1b7fce;
  --shadow-sm: 0 1px 2px rgba(20, 25, 40, .06), 0 1px 3px rgba(20, 25, 40, .05);
  --shadow-md: 0 4px 12px rgba(20, 25, 40, .10);
  --shadow-lg: 0 12px 32px rgba(20, 25, 40, .18);
  --radius: 10px;
  --radius-sm: 7px;
  --radius-lg: 16px;
  --header-h: 58px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
:root[data-theme="dark"] {
  --bg: #0e1117;
  --surface: #171b23;
  --surface-2: #1e232d;
  --surface-3: #262c38;
  --border: #2a3140;
  --border-strong: #39414f;
  --text: #e7eaf0;
  --text-muted: #9aa4b4;
  --text-faint: #717c8c;
  --accent: #7c7cf0;
  --accent-hover: #9090f5;
  --accent-soft: #23233b;
  --accent-contrast: #ffffff;
  --danger: #f2596d;
  --danger-soft: #35222a;
  --warn: #eaa53d;
  --warn-soft: #33291a;
  --success: #37c47f;
  --success-soft: #1a2f26;
  --info: #4aa8ec;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, .4);
  --shadow-lg: 0 12px 34px rgba(0, 0, 0, .55);
}

/* ---------- 3. Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  padding: 9px 13px;
  border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 500;
  min-height: 40px;
  transition: background .15s, border-color .15s, transform .05s, box-shadow .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary {
  background: var(--accent); color: var(--accent-contrast); border-color: transparent;
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { color: var(--danger); border-color: var(--border-strong); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn-icon {
  min-width: 40px; min-height: 40px; padding: 8px;
  border-color: transparent; background: transparent;
}
.btn-icon:hover { background: var(--surface-2); }
.btn-sm { min-height: 34px; padding: 6px 10px; font-size: 13px; }
.btn-block { width: 100%; }
.icon { width: 18px; height: 18px; display: inline-block; flex: none; }
.icon-sm { width: 15px; height: 15px; }

/* ---------- 4. App header (sticky) ---------- */
.app-header {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px;
  padding-top: calc(8px + var(--sat));
  padding-left: calc(16px + var(--sal));
  padding-right: calc(16px + var(--sar));
  min-height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand-logo {
  display: inline-flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 18px; letter-spacing: -.2px; color: var(--text);
}
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  background: linear-gradient(135deg, var(--accent), #8b8bff);
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 15px;
}
.brand-board {
  font-size: 13px; color: var(--text-muted); font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw;
}
.header-spacer { flex: 1 1 auto; }
.header-actions { display: flex; align-items: center; gap: 6px; }
.only-mobile { display: none !important; }

/* segmented control (language / theme) */
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--radius-sm); padding: 2px; }
.seg button {
  border: none; background: transparent; color: var(--text-muted);
  padding: 6px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; min-height: 32px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

/* ---------- 5. Layout ---------- */
.app-main {
  display: flex; flex-direction: column; gap: 12px;
  padding: 14px 16px 16px;
  padding-left: calc(16px + var(--sal));
  padding-right: calc(16px + var(--sar));
}

/* ---------- 6. Summary cards ---------- */
.summary {
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px;
}
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.stat-value { font-size: 22px; font-weight: 700; line-height: 1.1; }
.stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
.stat.accent .stat-value { color: var(--accent); }
.stat.warn .stat-value { color: var(--warn); }
.stat.danger .stat-value { color: var(--danger); }
.stat.success .stat-value { color: var(--success); }
.stat-progress {
  margin-top: 6px; height: 6px; background: var(--surface-2);
  border-radius: 99px; overflow: hidden;
}
.stat-progress > span { display: block; height: 100%; background: var(--success); border-radius: 99px; transition: width .3s; }

/* ---------- 7. Toolbar ---------- */
.toolbar { display: flex; flex-direction: column; gap: 10px; }
.toolbar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.search-wrap { position: relative; flex: 1 1 240px; min-width: 180px; }
.search-wrap > .icon {
  position: absolute; inset-inline-start: 11px; top: 50%; transform: translateY(-50%);
  color: var(--text-faint); pointer-events: none;
}
.search-input {
  width: 100%; padding: 10px 12px; padding-inline-start: 36px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); font-size: 16px; min-height: 42px;
}
.search-clear {
  position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; color: var(--text-faint);
  width: 30px; height: 30px; border-radius: 6px; display: none;
}
.search-wrap.has-value .search-clear { display: inline-flex; align-items: center; justify-content: center; }
.control {
  padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); font-size: 14px; min-height: 42px;
}
.control-label { display: inline-flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--text-muted); font-weight: 600; }

/* active filter chips */
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.active-filters:empty { display: none; }
.fchip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-soft); color: var(--accent); border: 1px solid transparent;
  padding: 5px 6px 5px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
  min-height: 30px;
}
.fchip button {
  border: none; background: transparent; color: inherit; display: inline-flex;
  align-items: center; justify-content: center; width: 20px; height: 20px;
  border-radius: 99px; padding: 0;
}
.fchip button:hover { background: rgba(0, 0, 0, .08); }

/* mobile filter/sort trigger buttons */
.filter-triggers { display: none; gap: 8px; width: 100%; }
.filter-triggers .btn { flex: 1; }
.badge-count {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px;
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}

/* ---------- 8. Mobile column navigation ---------- */
.mcol-nav { display: none; flex-direction: column; gap: 8px; }
.mcol-strip { display: flex; align-items: center; gap: 6px; }
.mcol-chips {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  flex: 1 1 auto; padding: 2px; scroll-snap-type: x proximity;
}
.mcol-chips::-webkit-scrollbar { display: none; }
.mcol-chip {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  border: 1px solid var(--border-strong); background: var(--surface);
  color: var(--text-muted); padding: 7px 12px; border-radius: 99px;
  font-size: 13px; font-weight: 600; min-height: 38px; flex: none;
}
.mcol-chip .dot { width: 9px; height: 9px; border-radius: 99px; flex: none; }
.mcol-chip[aria-current="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.mcol-chip .cnt {
  background: var(--surface-2); color: var(--text-muted); border-radius: 99px;
  min-width: 18px; height: 18px; padding: 0 4px; font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}
.mcol-chip[aria-current="true"] .cnt { background: var(--accent); color: #fff; }
.mcol-arrow { flex: none; }
.mcol-viewtoggle { display: flex; gap: 6px; }

/* ---------- 9. Board & columns ---------- */
.board {
  display: flex; gap: 14px; align-items: flex-start;
  overflow-x: auto; overflow-y: visible;
  padding: 2px 2px 14px; scroll-behavior: smooth;
  min-height: 40vh;
}
.column {
  flex: 0 0 300px; width: 300px; max-width: 300px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); display: flex; flex-direction: column;
  max-height: calc(100dvh - var(--header-h) - 40px);
  border-top: 3px solid var(--col-color, var(--accent));
}
.column.collapsed { flex-basis: 56px; width: 56px; }
.column.drop-target { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }
.col-head {
  display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px;
}
.col-color-dot { width: 12px; height: 12px; border-radius: 99px; flex: none; background: var(--col-color, var(--accent)); }
.col-title {
  font-weight: 700; font-size: 14.5px; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.col-count {
  background: var(--surface-3); color: var(--text-muted); border-radius: 99px;
  min-width: 20px; height: 20px; padding: 0 6px; font-size: 12px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.col-head-actions { display: flex; align-items: center; gap: 2px; flex: none; }
.column.collapsed .col-head { flex-direction: column; height: 100%; padding: 10px 6px; }
.column.collapsed .col-title { writing-mode: vertical-rl; white-space: nowrap; max-height: 60%; }
.column.collapsed .col-head-actions,
.column.collapsed .col-quickadd { display: none; }
.column.collapsed .col-body { display: none; }

.col-body {
  display: flex; flex-direction: column; gap: 8px; padding: 4px 10px 10px;
  overflow-y: auto; flex: 1; min-height: 20px;
}
.col-quickadd { padding: 0 10px 10px; }
.col-quickadd .btn {
  width: 100%; justify-content: center; color: var(--text-muted);
  border-style: dashed; background: transparent;
}
.col-quickadd .btn:hover { color: var(--accent); border-color: var(--accent); }

.col-empty {
  text-align: center; color: var(--text-faint); font-size: 13px;
  padding: 18px 8px; border: 1px dashed var(--border-strong); border-radius: var(--radius);
}

/* ---------- 10. Task cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 11px; box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; gap: 8px; position: relative;
  transition: box-shadow .15s, border-color .15s, opacity .15s;
}
.card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }
.card.dragging { opacity: .45; }
.card.completed { opacity: .72; }
.card.completed .card-title { text-decoration: line-through; color: var(--text-muted); }
.card.overdue { border-inline-start: 3px solid var(--danger); }
.card-top { display: flex; align-items: flex-start; gap: 8px; }
.drag-handle {
  cursor: grab; color: var(--text-faint); flex: none; padding: 2px; margin: -2px;
  touch-action: none; border-radius: 5px;
}
.drag-handle:active { cursor: grabbing; }
.card-title {
  font-size: 14px; font-weight: 600; flex: 1; min-width: 0;
  overflow-wrap: anywhere; word-break: break-word; /* wrap long titles fully */
}
.card-check {
  flex: none; width: 22px; height: 22px; border-radius: 6px;
  border: 1.5px solid var(--border-strong); background: var(--surface);
  display: inline-flex; align-items: center; justify-content: center; color: transparent;
  padding: 0;
}
.card.completed .card-check { background: var(--success); border-color: var(--success); color: #fff; }
.card-kebab { flex: none; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted);
  max-width: 100%;
}
.pill .pico { font-size: 11px; line-height: 1; }
.pill.prio-low { color: var(--success); background: var(--success-soft); border-color: transparent; }
.pill.prio-medium { color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent); border-color: transparent; }
.pill.prio-high { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.pill.prio-urgent { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
.pill.due.overdue { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
.pill.due.today { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.pill.checklist .bar {
  width: 34px; height: 5px; border-radius: 99px; background: var(--surface-3); overflow: hidden; display: inline-block;
}
.pill.checklist .bar > span { display: block; height: 100%; background: var(--success); }
.labels { display: flex; flex-wrap: wrap; gap: 5px; }
.label-tag {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent);
  overflow-wrap: anywhere;
}

/* ---------- 11. Dialog / modal / sheet ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100; display: none;
  background: rgba(15, 18, 26, .5);
  align-items: center; justify-content: center; padding: 20px;
}
.overlay.open { display: flex; }
.dialog {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  width: 100%; max-width: 560px; max-height: calc(100dvh - 40px);
  display: flex; flex-direction: column; overflow: hidden;
}
.dialog.narrow { max-width: 420px; }
.dialog-head {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  border-bottom: 1px solid var(--border); flex: none;
}
.dialog-title { font-size: 17px; font-weight: 700; flex: 1; min-width: 0; }
.dialog-body { padding: 16px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
.dialog-foot {
  display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  padding: 12px 16px; padding-bottom: calc(12px + var(--sab));
  border-top: 1px solid var(--border); flex: none; background: var(--surface);
}
.dialog-foot .spacer { flex: 1; }

/* form */
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field > label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.req { color: var(--danger); }
.input, .textarea, .select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); background: var(--surface); color: var(--text);
  font-size: 16px; /* >=16px avoids mobile zoom */
}
.textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field-error { color: var(--danger); font-size: 12.5px; margin-top: 5px; display: none; }
.field.invalid .input, .field.invalid .textarea, .field.invalid .select { border-color: var(--danger); }
.field.invalid .field-error { display: block; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

/* checklist editor */
.chk-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 8px; }
.chk-item { display: flex; align-items: center; gap: 8px; }
.chk-item input[type=checkbox] { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.chk-item .input { flex: 1; padding: 8px 10px; }
.chk-item.done .input { text-decoration: line-through; color: var(--text-muted); }

/* priority picker (color-independent, radio buttons with text) */
.prio-picker { display: flex; flex-wrap: wrap; gap: 6px; }
.prio-opt {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px;
  border: 1px solid var(--border-strong); border-radius: 99px; font-size: 13px; font-weight: 600;
  background: var(--surface); color: var(--text-muted); min-height: 38px; position: relative;
}
.prio-opt input { position: absolute; opacity: 0; width: 0; height: 0; }
.prio-opt:has(input:checked) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.prio-opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

/* color swatches */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 34px; height: 34px; border-radius: 8px; border: 2px solid transparent; position: relative;
  padding: 0;
}
.swatch[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 2px var(--surface) inset; }

/* detail view */
.detail-row { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.detail-row:last-child { border-bottom: none; }
.detail-key { flex: 0 0 34%; font-size: 13px; color: var(--text-muted); font-weight: 600; }
.detail-val { flex: 1; font-size: 14px; overflow-wrap: anywhere; }
.detail-desc { white-space: pre-wrap; }
.detail-checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.detail-checklist li { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.detail-checklist li.done { color: var(--text-muted); text-decoration: line-through; }
.detail-checklist input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }

/* generic menu (popover) */
.menu {
  position: fixed; z-index: 120; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 6px; min-width: 200px;
  max-height: 70vh; overflow-y: auto; display: none;
}
.menu.open { display: block; }
.menu button, .menu a {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: start;
  border: none; background: transparent; color: var(--text); padding: 10px 10px;
  border-radius: var(--radius-sm); font-size: 14px; min-height: 42px; text-decoration: none;
}
.menu button:hover, .menu a:hover { background: var(--surface-2); }
.menu button.danger { color: var(--danger); }
.menu .menu-sep { height: 1px; background: var(--border); margin: 5px 4px; }
.menu .menu-label { font-size: 11px; font-weight: 700; color: var(--text-faint); padding: 8px 10px 4px; text-transform: uppercase; letter-spacing: .04em; }

/* ---------- 12. Mobile menu / bottom sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 110; display: none; }
.sheet.open { display: block; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(15, 18, 26, .5); }
.sheet-panel {
  position: absolute; background: var(--surface); display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
}
/* side drawer variant (mobile menu) */
.sheet.drawer .sheet-panel {
  top: 0; bottom: 0; inset-inline-end: 0; width: min(88vw, 340px);
  padding-top: var(--sat); padding-bottom: var(--sab);
  border-inline-start: 1px solid var(--border);
}
/* bottom sheet variant (filters) */
.sheet.bottom .sheet-panel {
  inset-inline: 0; bottom: 0; max-height: 88dvh; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  border-top: 1px solid var(--border);
}
.sheet-head {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  border-bottom: 1px solid var(--border); flex: none;
}
.sheet-title { font-size: 16px; font-weight: 700; flex: 1; }
.sheet-body { padding: 14px 16px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
.sheet-foot {
  display: flex; gap: 8px; padding: 12px 16px; padding-bottom: calc(12px + var(--sab));
  border-top: 1px solid var(--border); flex: none; background: var(--surface);
}
.sheet-foot .btn { flex: 1; }
.menu-section { margin-bottom: 6px; }
.menu-section .menu-label { font-size: 11px; font-weight: 700; color: var(--text-faint); padding: 10px 4px 6px; text-transform: uppercase; letter-spacing: .04em; }

/* ---------- 13. Floating action button ---------- */
.fab {
  position: fixed; z-index: 45; display: none;
  inset-inline-end: calc(16px + var(--sar)); bottom: calc(16px + var(--sab));
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  box-shadow: var(--shadow-lg); align-items: center; justify-content: center;
}
.fab:active { transform: translateY(1px); }

/* ---------- 14. Toast ---------- */
.toast-wrap {
  position: fixed; z-index: 200; bottom: calc(80px + var(--sab)); inset-inline: 0;
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
.toast {
  background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 99px;
  font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow-lg); max-width: 90vw;
  display: flex; align-items: center; gap: 8px;
}
.toast.err { background: var(--danger); color: #fff; }
.toast.ok { background: var(--success); color: #fff; }

/* ---------- 15. Empty state (whole board) ---------- */
.board-empty { width: 100%; text-align: center; padding: 40px 16px; color: var(--text-muted); }
.board-empty h3 { margin: 8px 0 4px; color: var(--text); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* all-tasks list rendering */
.list-group-label {
  font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: .04em; padding: 6px 2px 2px; display: flex; align-items: center; gap: 8px;
}
.list-group-label .dot { width: 9px; height: 9px; border-radius: 99px; }

/* ---------- 16. Responsive: tablet ---------- */
@media (max-width: 1024px) {
  .summary { grid-template-columns: repeat(3, 1fr); }
}

/* ---------- 17. Responsive: mobile ---------- */
@media (max-width: 768px) {
  :root { --header-h: 54px; }
  .only-mobile { display: inline-flex !important; }
  .only-desktop { display: none !important; }
  .app-main { padding: 10px 10px 90px; }
  .summary { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat { padding: 10px 11px; }
  .stat-value { font-size: 19px; }
  .desktop-filters { display: none; }
  .filter-triggers { display: flex; }
  .mcol-nav { display: flex; }
  .fab { display: inline-flex; }

  /* Full-width scroll-snap columns */
  .board { scroll-snap-type: x mandatory; gap: 0; padding-bottom: 12px; }
  .column {
    flex: 0 0 100%; width: 100%; max-width: 100%;
    scroll-snap-align: center; scroll-snap-stop: always;
    margin-inline: 4px; max-height: none;
  }
  .column:first-child { margin-inline-start: 0; }
  .column:last-child { margin-inline-end: 0; }
  .column.collapsed { flex-basis: 100%; width: 100%; }
  .column.collapsed .col-head { flex-direction: row; height: auto; padding: 10px; }
  .column.collapsed .col-title { writing-mode: horizontal-tb; max-height: none; }
  .column.collapsed .col-head-actions { display: flex; }
  .card { padding: 12px; }
  .card-title { font-size: 15px; }
  .drag-handle { display: none; } /* touch uses actions menu instead */

  /* list (all tasks) view: stack cards full width, disable snap */
  .board.list-view { flex-direction: column; gap: 10px; scroll-snap-type: none; overflow-x: hidden; }
  .board.list-view .column { display: none; }

  /* Dialogs become full-screen sheets */
  .overlay { padding: 0; align-items: stretch; justify-content: stretch; }
  .dialog, .dialog.narrow {
    max-width: none; width: 100%; max-height: none; height: 100dvh; border-radius: 0; border: none;
  }
  .dialog-head { padding-top: calc(14px + var(--sat)); }
  .field-row { grid-template-columns: 1fr; } /* single-column form */
  .search-wrap { flex-basis: 100%; }
}

@media (max-width: 380px) {
  .summary { grid-template-columns: 1fr; }
}

/* ---------- 18. Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
</style>

  /* =====================================================================

  function t(key) {

    if (Array.isArray(raw.columns) && raw.columns.length) {

          id: id,
          key: typeof c.key === "string" && COLUMN_DEFAULTS[c.key] ? c.key : null,
          title: typeof c.title === "string" ? c.title : null,

          collapsed: !!c.collapsed,

  function loadData() {

  const saveData = debounce(function () {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }, 120);
  function saveNow() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

  // Keep per-column task order values contiguous.
  function normalizeOrders(data) {
    data.columns.forEach(function (col) {

        .sort(function (a, b) { return a.order - b.order; })
        .forEach(function (x, i) { x.order = i; });
    });
  }

  /* =====================================================================
     SECTION D — State
     ===================================================================== */

  const ui = {

  /* =====================================================================

     ===================================================================== */
  function getColumn(id) { return state.columns.find(function (c) { return c.id === id; }); }
  function getTask(id) { return state.tasks.find(function (x) { return x.id === id; }); }
  function columnTitle(col) {

    if (f.due === "upcoming") {
      if (task.completed || !task.dueDate) return false;
      const due = parseDate(task.dueDate);
      if (!due || due <= startOfToday()) return false;
    }
    if (f.due === "none" && task.dueDate) return false;
    if (f.due === "completed" && !task.completed) return false;
    if (f.priority !== "all" && task.priority !== f.priority) return false;
    if (f.label !== "all" && task.labels.indexOf(f.label) < 0) return false;

  function renderSummary() {

      { k: "dueToday", v: dueToday, cls: "warn" },
      { k: "overdue", v: overdue, cls: "danger" },

  /* =====================================================================
     SECTION G — Task mutations
     ===================================================================== */
  function addTask(fields) {
    const col = getColumn(fields.columnId) || sortedColumns()[0];
    const task = {
      id: uid(),
      title: fields.title, description: fields.description || "",
      priority: fields.priority || "none", dueDate: fields.dueDate || "",
      labels: fields.labels || [], checklist: fields.checklist || [],
      columnId: col.id, order: tasksInColumn(col.id).length,
      createdAt: nowISO(), updatedAt: nowISO(), completed: false, completedAt: null,
    };
    state.tasks.push(task);
    return task;
  }
  function updateTask(id, fields) {
    const task = getTask(id); if (!task) return;
    Object.assign(task, fields); task.updatedAt = nowISO();
  }
  function deleteTask(id) {
    const task = getTask(id); if (!task) return;
    const colId = task.columnId;
    state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
    reindexColumn(colId);
  }
  function duplicateTask(id) {
    const src = getTask(id); if (!src) return null;
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = uid();
    copy.checklist = copy.checklist.map(function (i) { return { id: uid(), text: i.text, done: i.done }; });
    copy.createdAt = nowISO(); copy.updatedAt = nowISO();
    copy.completed = false; copy.completedAt = null;
    copy.order = src.order + 0.5; // slot right after source, then reindex
    state.tasks.push(copy);
    reindexColumn(src.columnId);
    return copy;
  }
  function toggleComplete(id) {
    const task = getTask(id); if (!task) return;
    task.completed = !task.completed;
    task.completedAt = task.completed ? nowISO() : null;
    task.updatedAt = nowISO();
    return task.completed;
  }
  function reindexColumn(colId) { tasksInColumn(colId).forEach(function (x, i) { x.order = i; }); }
  function moveTaskToColumn(taskId, colId) {
    const task = getTask(taskId); if (!task || task.columnId === colId) return;
    const from = task.columnId;
    task.columnId = colId;
    task.order = tasksInColumn(colId).length + 1;
    task.updatedAt = nowISO();
    reindexColumn(from); reindexColumn(colId);
  }
  function moveTaskRelative(taskId, dir) {
    const task = getTask(taskId); if (!task) return false;
    const cols = sortedColumns();
    const idx = cols.findIndex(function (c) { return c.id === task.columnId; });
    const ni = idx + dir;
    if (ni < 0 || ni >= cols.length) return false;
    moveTaskToColumn(taskId, cols[ni].id);
    return true;
  }

  /* =====================================================================
     SECTION H — Column mutations
     ===================================================================== */
  function addColumn(name, color) {
    const col = { id: uid(), key: null, title: name, color: color, collapsed: false, order: state.columns.length };
    state.columns.push(col);
    return col;
  }
  function updateColumn(id, fields) { const col = getColumn(id); if (col) Object.assign(col, fields); }
  function deleteColumn(id) {
    state.tasks = state.tasks.filter(function (x) { return x.columnId !== id; });
    state.columns = state.columns.filter(function (c) { return c.id !== id; });
    sortedColumns().forEach(function (c, i) { c.order = i; });
  }
  function moveColumn(id, dir) {
    const cols = sortedColumns();
    const idx = cols.findIndex(function (c) { return c.id === id; });
    const ni = idx + dir;
    if (ni < 0 || ni >= cols.length) return;
    const tmp = cols[idx].order; cols[idx].order = cols[ni].order; cols[ni].order = tmp;
  }

  /* =====================================================================
     SECTION I — Dialog / focus management
     ===================================================================== */
  function focusables(el) {
    return $$('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', el)
      .filter(function (n) { return n.offsetWidth > 0 || n.offsetHeight > 0 || n === document.activeElement; });
  }
  function openOverlay(id) {
    ui.lastFocus = document.activeElement;
    const el = $("#" + id);
    el.classList.add("open");
    ui.openDialog = id;
    setTimeout(function () { const f = focusables(el)[0]; if (f) f.focus(); }, 20);
    document.addEventListener("keydown", trapKeydown, true);
  }
  function closeOverlay(id) {
    const el = $("#" + id); if (el) el.classList.remove("open");
    if (ui.openDialog === id) ui.openDialog = null;
    document.removeEventListener("keydown", trapKeydown, true);
    if (ui.lastFocus && ui.lastFocus.focus) { try { ui.lastFocus.focus(); } catch (e) {} }
  }
  function trapKeydown(e) {
    if (!ui.openDialog) return;
    if (e.key === "Escape") { e.preventDefault(); handleEscape(); return; }
    if (e.key !== "Tab") return;
    const el = $("#" + ui.openDialog); if (!el) return;
    const f = focusables(el); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  function handleEscape() {
    const id = ui.openDialog;
    if (id === "taskOverlay") { attemptCloseTaskForm(); return; }
    if (id === "confirmOverlay") { resolveConfirm(false); return; }
    if (id === "filterSheet" || id === "mobileMenu") { closeSheet(id); return; }
    closeOverlay(id);
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "focusboard-backup-" + todayStr() + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast(t("exportSuccess"), "ok");
  }
  function handleImportFile(file) {
    const reader = new FileReader();
    reader.onload = function () {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e) { toast(t("importError"), "err"); return; }
      const valid = validateData(migrate(parsed));
      if (!valid || !Array.isArray(valid.columns) || !valid.columns.length) { toast(t("importError"), "err"); return; }
      confirmDialog(t("confirmReplace"), t("confirmYes")).then(function (ok) {
        if (!ok) return;
        state = valid; ui.activeColIndex = 0; ui.listView = false;
        saveNow(); renderAll(); toast(t("importSuccess"), "ok");
      });
    };
    reader.onerror = function () { toast(t("importError"), "err"); };
    reader.readAsText(file);
  }

  function seedDemoTasks() {
    const byKey = {};
    state.columns.forEach(function (c) { if (c.key) byKey[c.key] = c.id; });
    const today = new Date();
    function offset(days) {
      const d = new Date(today); d.setDate(d.getDate() + days);
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    const demo = [
      { col: "inbox", title: "Read saved design articles", prio: "low", labels: ["reading"], desc: "Catch up on saved UX articles." },
      { col: "todo", title: "Plan weekly goals", prio: "medium", due: offset(1), labels: ["planning"], chk: ["Review last week", "Set 3 priorities"] },
      { col: "todo", title: "Book dentist appointment", prio: "high", due: offset(-1), labels: ["health"] },
      { col: "inprogress", title: "Write project proposal", prio: "urgent", due: offset(2), labels: ["work"], desc: "Draft scope, timeline, and budget.", chk: ["Outline", "First draft", "Review"], chkDone: 1 },
      { col: "waiting", title: "Waiting on client feedback", prio: "medium", labels: ["work"] },
      { col: "done", title: "Set up FocusBoard", prio: "none", labels: ["setup"], done: true },
    ];
    demo.forEach(function (d) {
      const colId = byKey[d.col] || state.columns[0].id;
      state.tasks.push({
        id: uid(), title: d.title, description: d.desc || "",
        priority: d.prio, dueDate: d.due || "", labels: d.labels || [],
        checklist: (d.chk || []).map(function (txt, i) { return { id: uid(), text: txt, done: d.done ? true : i < (d.chkDone || 0) }; }),
        columnId: colId, order: tasksInColumn(colId).length,
        createdAt: nowISO(), updatedAt: nowISO(),
        completed: !!d.done, completedAt: d.done ? nowISO() : null,
      });
    });
  }

  /* =====================================================================
     SECTION T — Drag & drop (desktop, native HTML5)
     ===================================================================== */
  let dragState = null;
  function onDragStart(e) {
    const card = e.target.closest(".card"); if (!card) return;
    dragState = { id: card.getAttribute("data-task") };
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragState.id); } catch (err) {}
  }
  function onDragEnd(e) {
    const card = e.target.closest(".card"); if (card) card.classList.remove("dragging");
    $$(".column.drop-target").forEach(function (c) { c.classList.remove("drop-target"); });
    dragState = null;
  }
  function onDragOver(e) {
    if (!dragState) return;
    const col = e.target.closest(".column");
    if (!col || col.classList.contains("collapsed")) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    $$(".column.drop-target").forEach(function (c) { if (c !== col) c.classList.remove("drop-target"); });
    col.classList.add("drop-target");
  }
  function onDrop(e) {
    if (!dragState) return;
    const col = e.target.closest(".column"); if (!col) return;
    e.preventDefault();
    const colId = col.getAttribute("data-col");
    const body = col.querySelector(".col-body");
    const beforeId = body ? getDropTargetId(body, e.clientY) : null;
    performDrop(dragState.id, colId, beforeId);
    col.classList.remove("drop-target");
    dragState = null;
  }
  function getDropTargetId(container, y) {
    const cards = $$(".card:not(.dragging)", container);
    for (let i = 0; i < cards.length; i++) {
      const r = cards[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) return cards[i].getAttribute("data-task");
    }
    return null;
  }
  function performDrop(taskId, colId, beforeId) {
    const task = getTask(taskId); if (!task) return;
    const fromCol = task.columnId;
    let list = tasksInColumn(colId).filter(function (x) { return x.id !== taskId; });
    let insertIdx = beforeId ? list.findIndex(function (x) { return x.id === beforeId; }) : list.length;
    if (insertIdx < 0) insertIdx = list.length;
    task.columnId = colId; task.updatedAt = nowISO();
    list.splice(insertIdx, 0, task);
    list.forEach(function (x, i) { x.order = i; });
    if (fromCol !== colId) reindexColumn(fromCol);
    renderData();
  }

  /* =====================================================================
     SECTION U — Mobile helpers
     ===================================================================== */
  function isMobile() { return window.matchMedia("(max-width: 768px)").matches; }
  function scrollToColumn(index, smooth) {
    if (!isMobile() || ui.listView) return;
    const board = $("#board");
    const cols = $$(".column", board);
    if (!cols[index]) return;
    board.scrollTo({ left: cols[index].offsetLeft - board.offsetLeft, behavior: smooth === false ? "auto" : "smooth" });
  }
  function updateActiveColFromScroll() {
    if (!isMobile() || ui.listView) return;
    const board = $("#board");
    const cols = $$(".column", board);
    if (!cols.length) return;
    const center = board.scrollLeft + board.clientWidth / 2;
    let best = 0, bestDist = Infinity;
    cols.forEach(function (c, i) {
      const mid = c.offsetLeft - board.offsetLeft + c.clientWidth / 2;
      const d = Math.abs(mid - center);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    if (best !== ui.activeColIndex) {
      ui.activeColIndex = best;
      $$("#mcolChips .mcol-chip").forEach(function (chip, i) { chip.setAttribute("aria-current", i === best ? "true" : "false"); });
      const active = $('#mcolChips .mcol-chip[data-mcol="' + best + '"]');
      if (active && active.scrollIntoView) active.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    }
  }
  function goColumn(delta) {
    const cols = sortedColumns();
    ui.activeColIndex = Math.max(0, Math.min(cols.length - 1, ui.activeColIndex + delta));
    scrollToColumn(ui.activeColIndex, true);
    renderMobileNav(cols);
  }

      const chk = e.target.closest("[data-detail-chk]"); if (!chk) return;
      const task = getTask(ui.detailTaskId); if (!task) return;
      const item = task.checklist.find(function (i) { return i.id === chk.getAttribute("data-detail-chk"); });
      if (item) { item.done = chk.checked; task.updatedAt = nowISO(); saveData(); renderSummary(); renderBoard(); openDetail(ui.detailTaskId); }
    });

    // Column dialog
    $("#colForm").addEventListener("submit", function (e) { e.preventDefault(); saveColForm(); });
    $("#btnSaveCol").addEventListener("click", saveColForm);
    $("#c-name").addEventListener("input", function () { clearFieldError("c-name-wrap"); });
    $("#c-name").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); saveColForm(); } });
    $("#c-swatches").addEventListener("click", function (e) {
      const s = e.target.closest("[data-swatch]"); if (!s) return;
      ui.colFormColor = s.getAttribute("data-swatch"); renderSwatches();
    });

    // Confirm dialog
    $("#confirmOk").addEventListener("click", function () { resolveConfirm(true); });
    $("#confirmCancel").addEventListener("click", function () { resolveConfirm(false); });
    $("#confirmOverlay").addEventListener("click", function (e) { if (e.target === this) resolveConfirm(false); });

    // Generic close (backdrop [data-close])
    document.addEventListener("click", function (e) {
      const closer = e.target.closest("[data-close]"); if (!closer) return;
      const which = closer.getAttribute("data-close");
      if (which === "task") attemptCloseTaskForm();
      else if (which === "detail") closeOverlay("detailOverlay");
      else if (which === "col") closeOverlay("colOverlay");
      else if (which === "filter") closeSheet("filterSheet");
      else if (which === "mmenu") closeSheet("mobileMenu");
    });
    ["taskOverlay", "detailOverlay", "colOverlay"].forEach(function (id) {
      $("#" + id).addEventListener("click", function (e) {
        if (e.target === this) { if (id === "taskOverlay") attemptCloseTaskForm(); else closeOverlay(id); }
      });
    });

    // Popover menu
    $("#popMenu").addEventListener("click", function (e) {
      const b = e.target.closest("[data-menuact]"); if (!b || b.disabled) return;
      handlePopAction(b.getAttribute("data-menuact"), b.getAttribute("data-value"));
      closePopMenu();
    });
    // Data menu
    $("#dataMenu").addEventListener("click", function (e) {
      const b = e.target.closest("[data-dataact]"); if (!b) return;
      handleDataAction(b.getAttribute("data-dataact")); closeDataMenu();
    });
    // Mobile menu actions
    $("#mobileMenuBody").addEventListener("click", function (e) {
      const lang = e.target.closest("[data-mm-lang]");
      if (lang) { setLanguage(lang.getAttribute("data-mm-lang")); renderMobileMenu(); return; }
      const theme = e.target.closest("[data-mm-theme]");
      if (theme) { setTheme(theme.getAttribute("data-mm-theme")); renderMobileMenu(); return; }
      const act = e.target.closest("[data-mm]");
      if (act) { closeSheet("mobileMenu"); handleDataAction(act.getAttribute("data-mm")); }
    });

    // Import file
    $("#importFile").addEventListener("change", function () {
      if (this.files && this.files[0]) handleImportFile(this.files[0]);
      this.value = "";
    });

    // Close menus on outside click
    document.addEventListener("click", function (e) {
      if (!e.target.closest("#popMenu") && !e.target.closest("[data-act='menu']") && !e.target.closest("[data-act='col-menu']")) closePopMenu();
      if (!e.target.closest("#dataMenu") && !e.target.closest("#btnData")) closeDataMenu();
    });
    // Escape closes lightweight popovers (dialogs handled by trap)
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      if ($("#popMenu").classList.contains("open")) { closePopMenu(); return; }
      if ($("#dataMenu").classList.contains("open")) { closeDataMenu(); return; }
    });

    // Resize: keep board layout consistent across breakpoint/orientation changes
    window.addEventListener("resize", debounce(function () { renderBoard(); }, 150));
    window.addEventListener("beforeunload", saveNow);
  }

  // Board click handler (delegated)
  function onBoardClick(e) {
    const collapseBtn = e.target.closest('[data-act="col-collapse"]');
    if (collapseBtn) {
      const col = getColumn(collapseBtn.closest(".column").getAttribute("data-col"));
      updateColumn(col.id, { collapsed: !col.collapsed }); renderData(); return;
    }
    const colMenuBtn = e.target.closest('[data-act="col-menu"]');
    if (colMenuBtn) {
      const col = getColumn(colMenuBtn.closest(".column").getAttribute("data-col"));
      ui.popContext = { type: "col", id: col.id };
      openPopMenu(colMenuBtn, columnMenuItems(col)); return;
    }
    const colAddBtn = e.target.closest('[data-act="col-add"]');
    if (colAddBtn) { openTaskForm(null, colAddBtn.closest(".column").getAttribute("data-col")); return; }

    const card = e.target.closest(".card"); if (!card) return;
    const taskId = card.getAttribute("data-task");
    if (e.target.closest('[data-act="toggle-complete"]')) {
      const done = toggleComplete(taskId); renderData();
      toast(done ? t("taskCompleted") : t("taskReopened"), "ok"); return;
    }
    const menuBtn = e.target.closest('[data-act="menu"]');
    if (menuBtn) { ui.popContext = { type: "task", id: taskId }; openPopMenu(menuBtn, taskMenuItems(getTask(taskId))); return; }
    if (e.target.closest("[data-noopen]")) return;
    openDetail(taskId);
  }

  // Popover action handler
  function handlePopAction(act, value) {
    const ctx = ui.popContext; if (!ctx) return;
    if (ctx.type === "task") {
      const id = ctx.id;
      if (act === "edit") openTaskForm(id);
      else if (act === "complete") { const d = toggleComplete(id); renderData(); toast(d ? t("taskCompleted") : t("taskReopened"), "ok"); }
      else if (act === "duplicate") { duplicateTask(id); renderData(); toast(t("taskDuplicated"), "ok"); }
      else if (act === "move-prev") { if (moveTaskRelative(id, -1)) { renderData(); toast(t("taskMoved"), "ok"); } }
      else if (act === "move-next") { if (moveTaskRelative(id, 1)) { renderData(); toast(t("taskMoved"), "ok"); } }
      else if (act === "move-col") { moveTaskToColumn(id, value); renderData(); toast(t("taskMoved"), "ok"); }
      else if (act === "delete") {
        confirmDialog(t("confirmDeleteTask"), t("delete")).then(function (ok) { if (ok) { deleteTask(id); renderData(); toast(t("taskDeleted"), "ok"); } });
      }
    } else if (ctx.type === "col") {
      const id = ctx.id; const col = getColumn(id);
      if (act === "col-add-task") openTaskForm(null, id);
      else if (act === "col-rename") openColForm(id);
      else if (act === "col-collapse") { updateColumn(id, { collapsed: !col.collapsed }); renderData(); }
      else if (act === "col-left") { moveColumn(id, -1); syncActiveToCol(id); renderData(); }
      else if (act === "col-right") { moveColumn(id, 1); syncActiveToCol(id); renderData(); }
      else if (act === "col-delete") {
        const n = tasksInColumn(id).length;
        const msg = n ? t("confirmDeleteColumnTasks").replace("{n}", n) : t("confirmDeleteColumnEmpty");
        confirmDialog(msg, t("delete")).then(function (ok) {
          if (!ok) return;
          deleteColumn(id);
          ui.activeColIndex = Math.max(0, Math.min(ui.activeColIndex, sortedColumns().length - 1));
          renderData(); toast(t("columnDeleted"), "ok");
        });
      }
    }
  }
  function syncActiveToCol(colId) {
    const idx = sortedColumns().findIndex(function (c) { return c.id === colId; });
    if (idx >= 0) ui.activeColIndex = idx;
  }
  function handleDataAction(act) {
    if (act === "export") exportBackup();
    else if (act === "import") $("#importFile").click();
    else if (act === "reset") resetBoard();
    else if (act === "demo") loadDemo(state.tasks.length > 0);
  }
  function toggleDataMenu(anchor) {
    const menu = $("#dataMenu");
    if (menu.classList.contains("open")) closeDataMenu(); else openDataMenu(anchor);
  }

  /* =====================================================================
     SECTION Y — Init
     ===================================================================== */
  function init() {
    const loaded = loadData();
    if (loaded === null) {
      // First launch ever: seed demo data once.
      state = defaultData();
      state.demoSeeded = true;
      seedDemoTasks();
      saveNow();
    } else {
      state = loaded;
    }
    wireEvents();
    renderAll();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

})();
</script>
</body>
</html>
